spring:
  application:
    name: box-dispatch-system

  profiles:
    active: postgres

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.rest.RepositoryRestMvcAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

  mvc:
    contentnegotiation:
      favor-parameter: false
      favor-path-extension: false

  web:
    resources:
      add-mappings: false

  main:
    allow-bean-definition-overriding: true

  security:
    filter:
      dispatcher-types: REQUEST,ERROR,ASYNC

  datasource:
    url: jdbc:postgresql://localhost:5432/boxdispatch
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: HikariPool
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        connection:
          provider_disables_autocommit: true

  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  sql:
    init:
      mode: never

  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

server:
  port: 8000
  # servlet:
  #   context-path: /api

app:
  idempotency:
    ttl-hours: 24
    lock-ttl-seconds: 30

  jwt:
    secret-key: 3hbXrhqhmvPD0bVq9Ce4hxTqALG701J7jRXyfKjqtzDPIlbdJ8YMIfZtHmPlC6Js9JVpELE2tj4KGP1VoCMA4Ya58WGF3Hs1
    expiration-minutes: 1440
    refresh-expiration-days: 7
    issuer: UDS
    audience: Authorized UDS USERS
    clock-skew-seconds: 30
    algorithm: HS256
    token-prefix: Bearer
    authorization-header: Authorization
    enable-token-blacklist: true
    blacklist-cleanup-interval-minutes: 60
    max-blacklist-size: 10000
    cookie-name: jwt-token
    http-only-cookie: true
    secure-cookie: true
    same-site-cookie: Strict
    cors-allowed-origins: "http://localhost:3000,http://localhost:3001,http://localhost:8000"
    enable-multi-factor-support: false
    max-tokens-per-user: 5
    log-token-issuance: false
    enable-token-rotation: true
    rotation-grace-period-minutes: 5
    access-token:
      expiration: 900000
    refresh-token:
      expiration: 604800000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
    enabled: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false
  packages-to-scan: com.boxdispatch

logging:
  level:
    root: INFO
    com.boxdispatch: DEBUG
    org.springframework.web: INFO
    org.springframework.web.servlet.mvc.method.annotation: WARN
    org.springframework.security: INFO
    org.springframework.security.web.FilterChainProxy: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"