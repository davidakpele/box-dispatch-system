<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BoxDispatch — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:       #0d0d0d;
      --ink-soft:  #4a4a4a;
      --surface:   #f5f3ef;
      --card:      #ffffff;
      --accent:    #1a1a2e;
      --accent-2:  #e63946;
      --border:    #e0ddd8;
      --radius:    12px;
      --font-head: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--surface);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      color: var(--ink);
    }

    /* ── Left panel ── */
    .left-panel {
      background: var(--accent);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px;
      position: relative;
      overflow: hidden;
    }

    .left-panel::before {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: rgba(230, 57, 70, 0.12);
      top: -120px; left: -120px;
    }

    .left-panel::after {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      bottom: 60px; right: -80px;
    }

    .brand {
      font-family: var(--font-head);
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
      z-index: 1;
    }

    .brand span { color: var(--accent-2); }

    .left-copy { z-index: 1; }

    .left-copy h1 {
      font-family: var(--font-head);
      font-size: clamp(32px, 3vw, 48px);
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 20px;
      letter-spacing: -1px;
    }

    .left-copy p {
      color: rgba(255,255,255,0.55);
      font-size: 15px;
      line-height: 1.7;
      max-width: 360px;
    }

    .stats {
      display: flex;
      gap: 32px;
      z-index: 1;
    }

    .stat-item { }
    .stat-num {
      font-family: var(--font-head);
      font-size: 28px;
      font-weight: 700;
      color: #fff;
    }
    .stat-label {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    /* ── Right panel ── */
    .right-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
    }

    .form-card {
      width: 100%;
      max-width: 400px;
    }

    .form-card h2 {
      font-family: var(--font-head);
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .form-card .subtitle {
      color: var(--ink-soft);
      font-size: 14px;
      margin-bottom: 36px;
    }

    .form-card .subtitle a {
      color: var(--accent-2);
      text-decoration: none;
      font-weight: 500;
    }

    .field { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 7px;
      color: var(--ink);
    }

    input[type="text"],
    input[type="password"],
    input[type="email"] {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: 15px;
      background: var(--card);
      color: var(--ink);
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(26,26,46,0.08);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-head);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: .02em;
      transition: background .2s, transform .1s;
      margin-top: 8px;
      position: relative;
    }

    .btn-primary:hover  { background: #2a2a4e; }
    .btn-primary:active { transform: scale(.99); }

    .btn-primary.loading::after {
      content: '';
      position: absolute;
      right: 18px; top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

    .error-msg {
      display: none;
      background: #fff0f0;
      border: 1px solid #fcc;
      color: #c0392b;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      margin-bottom: 20px;
    }

    .error-msg.show { display: block; }

    @media (max-width: 768px) {
      body { grid-template-columns: 1fr; }
      .left-panel { display: none; }
      .right-panel { padding: 32px 24px; }
    }
  </style>
</head>
<body>

  <!-- Left branding panel -->
  <div class="left-panel">
    <div class="brand">Box<span>Dispatch</span></div>
    <div class="left-copy">
      <h1>Smart delivery, every time.</h1>
      <p>Manage your dispatch boxes, track battery levels, and coordinate item loading from a single dashboard.</p>
    </div>
    <div class="stats">
      <div class="stat-item">
        <div class="stat-num">500g</div>
        <div class="stat-label">Max payload</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">6</div>
        <div class="stat-label">Box states</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">25%</div>
        <div class="stat-label">Min battery</div>
      </div>
    </div>
  </div>

  <!-- Right form panel -->
  <div class="right-panel">
    <div class="form-card">
      <h2>Welcome back</h2>
      <p class="subtitle">Don't have an account? <a href="/register">Sign up</a></p>

      <div id="error-msg" class="error-msg"></div>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="your_username" autocomplete="username"/>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>

      <button class="btn-primary" id="login-btn" onclick="handleLogin()">Sign in</button>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem('bd_token')) {
      window.location.href = '/dashboard';
    }

    async function handleLogin() {
      const btn      = document.getElementById('login-btn');
      const errEl    = document.getElementById('error-msg');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      errEl.classList.remove('show');

      if (!username || !password) {
        showError('Please fill in all fields.');
        return;
      }

      btn.classList.add('loading');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const res  = await fetch('/api/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ username, password })
        });

        const body = await res.json();

        if (!res.ok || !body.success) {
          showError(body.message || 'Invalid credentials. Please try again.');
          return;
        }

        localStorage.setItem('bd_token',    body.data.token);
        localStorage.setItem('bd_username', body.data.username);
        localStorage.setItem('bd_role',     body.data.role);
        // Cookie lets the server-side filter validate JWT on page requests
        document.cookie = `bd_token=${body.data.token}; path=/; SameSite=Strict`;
        window.location.href = '/dashboard';

      } catch (e) {
        showError('Network error. Please try again.');
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.add('show');
    }

    // Allow Enter key submit
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
