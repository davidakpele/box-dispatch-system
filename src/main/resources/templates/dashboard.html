<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BoxDispatch — Dashboard</title>
  <!-- Runs before anything renders — redirects to /login if no JWT in storage -->
  <script>if (!localStorage.getItem('bd_token')) window.location.replace('/login');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:       #0d0d0d;
      --ink-soft:  #6b6b6b;
      --surface:   #f5f3ef;
      --card:      #ffffff;
      --accent:    #1a1a2e;
      --accent-2:  #e63946;
      --border:    #e0ddd8;
      --radius:    12px;
      --font-head: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;

      --state-idle:       #e8f4fd;
      --state-idle-text:  #1a6fa0;
      --state-loading:    #fff7e6;
      --state-loading-text: #b45309;
      --state-loaded:     #ecfdf5;
      --state-loaded-text:#065f46;
      --state-delivering: #f0fdf4;
      --state-delivering-text: #166534;
      --state-other:      #f3f4f6;
      --state-other-text: #374151;
    }

    body {
      font-family: var(--font-body);
      background: var(--surface);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── Topbar ── */
    .topbar {
      background: var(--accent);
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-family: var(--font-head);
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .brand span { color: var(--accent-2); }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .user-chip {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
    }

    .user-chip strong {
      color: #fff;
      font-weight: 500;
    }

    .btn-logout {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.75);
      padding: 6px 14px;
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 13px;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.18); }

    /* ── Layout ── */
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 36px 24px;
    }

    .page-title {
      font-family: var(--font-head);
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .page-sub {
      color: var(--ink-soft);
      font-size: 14px;
      margin-bottom: 36px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .card-title {
      font-family: var(--font-head);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .01em;
    }

    .card-action {
      font-size: 12px;
      color: var(--accent-2);
      cursor: pointer;
      font-weight: 500;
      background: none;
      border: none;
      font-family: var(--font-body);
    }

    /* ── Forms ── */
    .field { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 10px 13px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 14px;
      background: var(--surface);
      color: var(--ink);
      outline: none;
      transition: border-color .2s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      background: #fff;
    }

    textarea { resize: vertical; min-height: 80px; font-family: var(--font-mono); font-size: 12px; }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-family: var(--font-head);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity .2s, transform .1s;
      letter-spacing: .02em;
    }
    .btn:active { transform: scale(.98); }
    .btn-dark   { background: var(--accent); color: #fff; }
    .btn-dark:hover { opacity: .88; }
    .btn-red    { background: var(--accent-2); color: #fff; }
    .btn-red:hover { opacity: .88; }
    .btn-ghost  { background: var(--surface); color: var(--ink); border: 1.5px solid var(--border); }
    .btn-ghost:hover { border-color: var(--accent); }
    .btn-sm { padding: 7px 14px; font-size: 12px; }
    .btn-full { width: 100%; }

    /* ── State badges ── */
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .badge-IDLE       { background: var(--state-idle);       color: var(--state-idle-text); }
    .badge-LOADING    { background: var(--state-loading);    color: var(--state-loading-text); }
    .badge-LOADED     { background: var(--state-loaded);     color: var(--state-loaded-text); }
    .badge-DELIVERING { background: var(--state-delivering); color: var(--state-delivering-text); }
    .badge-DELIVERED  { background: #ede9fe; color: #5b21b6; }
    .badge-RETURNING  { background: #fce7f3; color: #9d174d; }

    /* ── Battery bar ── */
    .battery-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 6px;
    }
    .battery-fill {
      height: 100%;
      border-radius: 4px;
      transition: width .4s;
    }

    /* ── Boxes list ── */
    .box-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .box-row:last-child { border-bottom: none; }

    .box-txref {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
    }

    .box-meta {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 2px;
    }

    .box-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    /* ── Response viewer ── */
    .response-block {
      background: #0d0d0d;
      border-radius: 8px;
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: #a6e3a1;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 240px;
      overflow-y: auto;
      margin-top: 14px;
      display: none;
    }
    .response-block.show { display: block; }
    .response-block.error { color: #f38ba8; }

    /* ── Items table ── */
    .items-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 12px;
    }
    .items-table th {
      text-align: left;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: .05em;
      border-bottom: 1px solid var(--border);
    }
    .items-table td {
      padding: 10px 10px;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .items-table tr:last-child td { border-bottom: none; }

    .empty-state {
      text-align: center;
      padding: 32px;
      color: var(--ink-soft);
      font-size: 13px;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--ink);
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .25s, transform .25s;
      z-index: 999;
      max-width: 320px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { border-left: 3px solid #22c55e; }
    .toast.error   { border-left: 3px solid var(--accent-2); }

    @media (max-width: 900px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <nav class="topbar">
    <div class="brand">Box<span>Dispatch</span></div>
    <div class="topbar-right">
      <span class="user-chip">Logged in as <strong id="nav-username">—</strong></span>
      <button class="btn-logout" onclick="logout()">Sign out</button>
    </div>
  </nav>

  <div class="page">
    <div class="page-title">Dispatch Dashboard</div>
    <div class="page-sub">Test all box operations below — data loads live from the API.</div>

    <!-- Row 1: Available boxes + Battery check -->
    <div class="grid-2">

      <!-- Available boxes -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Available boxes</span>
          <button class="card-action" onclick="loadAvailableBoxes()">↻ Refresh</button>
        </div>
        <div id="available-list"><div class="empty-state">Click refresh to load.</div></div>
      </div>

      <!-- Battery check -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Battery level</span>
        </div>
        <div class="field">
          <label>Box txref</label>
          <input type="text" id="bat-txref" placeholder="BOX-001"/>
        </div>
        <button class="btn btn-ghost btn-full" onclick="checkBattery()">Check battery</button>
        <div id="bat-result" class="response-block"></div>
      </div>

    </div>

    <!-- Row 2: Create box + Load items -->
    <div class="grid-2">

      <!-- Create box -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Create a box</span>
        </div>
        <div class="field">
          <label>txref (max 20 chars)</label>
          <input type="text" id="new-txref" placeholder="MY-BOX-001" maxlength="20"/>
        </div>
        <div class="field">
          <label>Weight limit (g, max 500)</label>
          <input type="number" id="new-weight" placeholder="500" min="0.001" max="500" step="0.001"/>
        </div>
        <div class="field">
          <label>Battery capacity (%)</label>
          <input type="number" id="new-battery" placeholder="100" min="0" max="100"/>
        </div>
        <button class="btn btn-dark btn-full" onclick="createBox()">Create box</button>
        <div id="create-result" class="response-block"></div>
      </div>

      <!-- Load items -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Load items into box</span>
        </div>
        <div class="field">
          <label>Box txref</label>
          <input type="text" id="load-txref" placeholder="BOX-001"/>
        </div>
        <div class="field">
          <label>Idempotency key (optional)</label>
          <input type="text" id="load-idem" placeholder="unique-key-123"/>
        </div>
        <div class="field">
          <label>Items (JSON array)</label>
          <textarea id="load-items" placeholder='[{"name":"Parcel-X","weight":50.000,"code":"PARCEL_X_001"}]'></textarea>
        </div>
        <button class="btn btn-red btn-full" onclick="loadItems()">Load items</button>
        <div id="load-result" class="response-block"></div>
      </div>

    </div>

    <!-- Row 3: Inspect box items -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Inspect loaded items</span>
      </div>
      <div style="display:flex;gap:10px;align-items:flex-end;">
        <div class="field" style="flex:1;margin-bottom:0">
          <label>Box txref</label>
          <input type="text" id="inspect-txref" placeholder="BOX-LOADED"/>
        </div>
        <button class="btn btn-ghost" onclick="inspectItems()">Fetch items</button>
      </div>
      <div id="items-table-wrap" style="margin-top:16px;"></div>
    </div>

  </div><!-- /page -->

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ─── Auth guard ───────────────────────────────────────────────────────────
    const token = localStorage.getItem('bd_token');
    if (!token) window.location.href = '/login';

    document.getElementById('nav-username').textContent =
      localStorage.getItem('bd_username') || '—';

    function logout() {
      localStorage.removeItem('bd_token');
      localStorage.removeItem('bd_username');
      localStorage.removeItem('bd_role');
      // Clear the server-readable cookie too
      document.cookie = 'bd_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=Strict';
      window.location.href = '/login';
    }

    // ─── API helper ───────────────────────────────────────────────────────────
    async function api(method, path, body) {
      const opts = {
        method,
        headers: {
          'Content-Type':  'application/json',
          'Authorization': `Bearer ${token}`
        }
      };
      if (body) opts.body = JSON.stringify(body);
      const res  = await fetch('/api/v1' + path, opts);
      const data = await res.json();
      if (res.status === 401) {
        logout();
        return null;
      }
      return { ok: res.ok, status: res.status, data };
    }

    // ─── Toast ────────────────────────────────────────────────────────────────
    function toast(msg, type = 'success') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className   = `toast ${type} show`;
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    // ─── Show response ────────────────────────────────────────────────────────
    function showResponse(elId, data, ok) {
      const el = document.getElementById(elId);
      el.textContent = JSON.stringify(data, null, 2);
      el.className = `response-block show${ok ? '' : ' error'}`;
    }

    // ─── Battery color ────────────────────────────────────────────────────────
    function batteryColor(pct) {
      if (pct >= 50) return '#22c55e';
      if (pct >= 25) return '#f59e0b';
      return '#ef4444';
    }

    // ─── State badge ─────────────────────────────────────────────────────────
    function stateBadge(state) {
      return `<span class="badge badge-${state}">${state}</span>`;
    }

    // ─── Load available boxes ─────────────────────────────────────────────────
    async function loadAvailableBoxes() {
      const wrap = document.getElementById('available-list');
      wrap.innerHTML = '<div class="empty-state">Loading...</div>';
      const res = await api('GET', '/boxes/available');
      if (!res) return;

      const boxes = res.data?.data || [];
      if (!boxes.length) {
        wrap.innerHTML = '<div class="empty-state">No boxes available for loading.</div>';
        return;
      }

      wrap.innerHTML = boxes.map(b => `
        <div class="box-row">
          <div>
            <div class="box-txref">${b.txref}</div>
            <div class="box-meta">${b.remainingCapacity ?? '—'}g remaining · ${b.batteryCapacity}% battery</div>
            <div class="battery-bar"><div class="battery-fill" style="width:${b.batteryCapacity}%;background:${batteryColor(b.batteryCapacity)}"></div></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            ${stateBadge(b.state)}
            <button class="btn btn-ghost btn-sm" onclick="prefillLoad('${b.txref}')">Load →</button>
          </div>
        </div>
      `).join('');
    }

    function prefillLoad(txref) {
      document.getElementById('load-txref').value = txref;
      document.getElementById('load-txref').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // ─── Battery check ────────────────────────────────────────────────────────
    async function checkBattery() {
      const txref = document.getElementById('bat-txref').value.trim();
      if (!txref) { toast('Enter a txref', 'error'); return; }

      const res = await api('GET', `/boxes/${txref}/battery`);
      if (!res) return;

      showResponse('bat-result', res.data, res.ok);
      if (res.ok) toast(`Battery: ${res.data.data?.batteryCapacity ?? '?'}%`);
      else toast(res.data.message || 'Error', 'error');
    }

    // ─── Create box ───────────────────────────────────────────────────────────
    async function createBox() {
      const txref       = document.getElementById('new-txref').value.trim();
      const weightLimit = parseFloat(document.getElementById('new-weight').value);
      const battery     = parseInt(document.getElementById('new-battery').value);

      if (!txref || isNaN(weightLimit) || isNaN(battery)) {
        toast('Fill in all fields', 'error'); return;
      }

      const res = await api('POST', '/boxes', { txref, weightLimit, batteryCapacity: battery });
      if (!res) return;

      showResponse('create-result', res.data, res.ok);
      if (res.ok) {
        toast(`Box "${txref}" created!`);
        loadAvailableBoxes();
      } else {
        toast(res.data.message || 'Failed to create box', 'error');
      }
    }

    // ─── Load items ───────────────────────────────────────────────────────────
    async function loadItems() {
      const txref   = document.getElementById('load-txref').value.trim();
      const idemKey = document.getElementById('load-idem').value.trim();
      let   items;

      try {
        items = JSON.parse(document.getElementById('load-items').value);
      } catch {
        toast('Items must be valid JSON', 'error'); return;
      }

      if (!txref || !items?.length) {
        toast('Enter a txref and at least one item', 'error'); return;
      }

      const body = { items };
      if (idemKey) body.idempotencyKey = idemKey;

      const res = await api('POST', `/boxes/${txref}/load`, body);
      if (!res) return;

      showResponse('load-result', res.data, res.ok);
      if (res.ok) {
        toast(`${res.data.data?.itemsLoaded ?? 0} item(s) loaded`);
        loadAvailableBoxes();
      } else {
        toast(res.data.message || 'Failed to load items', 'error');
      }
    }

    // ─── Inspect items ────────────────────────────────────────────────────────
    async function inspectItems() {
      const txref = document.getElementById('inspect-txref').value.trim();
      if (!txref) { toast('Enter a txref', 'error'); return; }

      const res = await api('GET', `/boxes/${txref}/items`);
      if (!res) return;

      const wrap = document.getElementById('items-table-wrap');
      if (!res.ok) {
        wrap.innerHTML = `<div class="empty-state" style="color:#e63946">${res.data.message || 'Error fetching items'}</div>`;
        return;
      }

      const items = res.data?.data || [];
      if (!items.length) {
        wrap.innerHTML = '<div class="empty-state">No items loaded in this box.</div>';
        return;
      }

      wrap.innerHTML = `
        <table class="items-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Code</th>
              <th>Weight (g)</th>
              <th>Loaded at</th>
            </tr>
          </thead>
          <tbody>
            ${items.map(i => `
              <tr>
                <td>${i.name}</td>
                <td>${i.code}</td>
                <td>${i.weight}</td>
                <td>${i.createdAt ? new Date(i.createdAt).toLocaleString() : '—'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    // ─── Auto-load on page open ───────────────────────────────────────────────
    loadAvailableBoxes();
  </script>
</body>
</html>
