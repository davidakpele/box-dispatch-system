# prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    environment: docker
    application: box-dispatch-system

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: box-dispatch-app
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: box-dispatch-app
          env: docker
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis