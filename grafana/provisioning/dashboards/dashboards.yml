apiVersion: 1

providers:

  - name: Box Dispatch Dashboards
    orgId: 1
    folder: Box Dispatch System
    folderUid: box-dispatch
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false